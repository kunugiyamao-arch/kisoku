<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ガイド</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1E5AA8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10151F" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ガイド">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>

:root{
  --paper:#F4F6F9; --card:#FFFFFF; --ink:#18243D; --sub:#55627A;
  --line:#1E5AA8; --line-soft:#E3ECF8; --rule:#D3DAE4;
  --red:#C8102E; --caution:#F3C63F; --caution-soft:#FFF6D6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10151F; --card:#18202E; --ink:#E8EDF5; --sub:#A3AEC2;
    --line:#6FA3E8; --line-soft:#1F2D44; --rule:#2C3748;
    --red:#FF6B7F; --caution:#E9BC3A; --caution-soft:#3A3219;
  }
}
:root[data-theme="dark"]{
  --paper:#10151F; --card:#18202E; --ink:#E8EDF5; --sub:#A3AEC2;
  --line:#6FA3E8; --line-soft:#1F2D44; --rule:#2C3748;
  --red:#FF6B7F; --caution:#E9BC3A; --caution-soft:#3A3219;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","BIZ UDPGothic","Yu Gothic","Meiryo",sans-serif;
  font-size:17px;line-height:1.8;-webkit-text-size-adjust:100%}
a{color:var(--line)}
:focus-visible{outline:3px solid var(--caution);outline-offset:2px;border-radius:4px}
.wrap{max-width:760px;margin:0 auto;
  padding:0 calc(18px + env(safe-area-inset-left)) calc(96px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-right))}
.sign .wrap{padding-top:calc(28px + env(safe-area-inset-top))}
.tocbtn{bottom:calc(16px + env(safe-area-inset-bottom))!important;right:calc(16px + env(safe-area-inset-right))!important}
#gate{padding-top:calc(24px + env(safe-area-inset-top));padding-bottom:calc(24px + env(safe-area-inset-bottom))}


.sign{background:var(--card);border-bottom:6px solid var(--line);position:relative}
.sign::after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:6px;background:var(--red)}
.sign .wrap{padding-top:28px;padding-bottom:26px}
.sign h1{margin:0;font-size:clamp(28px,7vw,40px);line-height:1.3;letter-spacing:.04em}
.sign p{margin:6px 0 0;color:var(--sub);font-size:15px}

.notice{margin:34px 0 20px;background:var(--caution-soft);border-left:6px solid var(--caution);
  padding:12px 16px;border-radius:0 8px 8px 0;font-size:15px}

.search{position:relative;margin:0 0 8px}
.search input{width:100%;font:inherit;font-size:17px;padding:14px 16px;border:2px solid var(--rule);
  border-radius:10px;background:var(--card);color:var(--ink)}
.search input:focus{border-color:var(--line);outline:none}
#results{margin-top:10px}
#results .hit{display:block;background:var(--card);border:1px solid var(--rule);border-radius:8px;
  padding:10px 14px;margin-bottom:8px;text-decoration:none;color:var(--ink)}
#results .hit b{color:var(--line)}
#results .hit span{display:block;font-size:14px;color:var(--sub)}

h2.sec{font-size:22px;margin:36px 0 12px}


.faq{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.faq a{display:block;background:var(--card);border:2px solid var(--rule);border-radius:10px;
  padding:12px 14px;text-decoration:none;color:var(--ink);font-weight:700;line-height:1.5}
.faq a:hover{border-color:var(--line)}
.faq a small{display:block;font-weight:400;color:var(--sub);font-size:13px;margin-top:2px}


.route{position:relative;margin:8px 0 0;padding:0;list-style:none}
.route::before{content:"";position:absolute;left:15px;top:14px;bottom:14px;width:8px;
  background:var(--line);border-radius:4px}
.chap{position:relative;padding-left:52px;margin-bottom:22px}
.chap::before{content:"";position:absolute;left:4px;top:4px;width:30px;height:30px;border-radius:50%;
  background:var(--card);border:6px solid var(--line)}
.chap-title{font-size:20px;font-weight:700;margin:0;line-height:1.6}
.chap-title small{font-weight:400;color:var(--sub);font-size:14px;margin-left:6px}
.stops{list-style:none;margin:8px 0 0;padding:0}
.stops li{position:relative}
.stops li::before{content:"";position:absolute;left:-44px;top:21px;width:14px;height:14px;border-radius:50%;
  background:var(--card);border:3px solid var(--line)}
.stops a{display:flex;justify-content:space-between;gap:12px;align-items:center;text-decoration:none;
  color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:8px;
  padding:10px 14px;margin-bottom:8px}
.stops a:hover{border-color:var(--line);background:var(--line-soft)}
.stops a .nm{font-weight:700}
.stops a .rg{font-size:13px;color:var(--sub);white-space:nowrap}


.page{display:none}
.page.show{display:block}
.crumb{margin:30px 0 4px;font-size:14px;color:var(--sub)}
.ptitle{font-size:clamp(24px,6vw,32px);margin:0 0 6px;line-height:1.4}
.plead{color:var(--sub);margin:0 0 18px}

.art{background:var(--card);border:1px solid var(--rule);border-radius:10px;margin:0 0 14px;overflow:hidden;
  scroll-margin-top:16px}
.art header{display:flex;gap:12px;align-items:baseline;padding:14px 16px 0}
.no{flex:none;background:var(--line);color:#fff;font-weight:700;font-size:14px;border-radius:6px;
  padding:2px 9px;line-height:1.7}
:root[data-theme="dark"] .no{color:#0E1522}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .no{color:#0E1522}}
.art h3{margin:0;font-size:19px;line-height:1.5}
.short{margin:10px 16px 0;padding:8px 12px;background:var(--line-soft);border-radius:6px;font-weight:700}
.body{padding:4px 16px 14px}
.body ul{margin:8px 0;padding-left:1.3em}
.body li{margin:4px 0}
.body p{margin:8px 0}
.pt{background:var(--caution-soft);border-left:5px solid var(--caution);padding:8px 12px;
  border-radius:0 6px 6px 0;margin:10px 0;font-size:16px}
.tbl{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;min-width:420px;font-size:15px;line-height:1.55}
th,td{border:1px solid var(--rule);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--line-soft)}
td.n{text-align:center;font-weight:700;white-space:nowrap}

.pager{display:flex;justify-content:space-between;gap:10px;margin-top:26px}
.pager a{flex:1;display:block;text-align:center;text-decoration:none;background:var(--card);
  border:2px solid var(--line);color:var(--line);font-weight:700;border-radius:10px;padding:12px 10px;line-height:1.4}
.pager a.empty{visibility:hidden}

.tocbtn{position:fixed;right:16px;bottom:16px;z-index:5;background:var(--line);color:#fff;border:0;
  font:inherit;font-weight:700;font-size:16px;padding:12px 18px;border-radius:30px;cursor:pointer;
  box-shadow:0 3px 10px rgba(0,0,0,.25);text-decoration:none}
:root[data-theme="dark"] .tocbtn{color:#0E1522}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tocbtn{color:#0E1522}}
footer{margin-top:40px;color:var(--sub);font-size:14px;border-top:1px solid var(--rule);padding-top:14px}


body.locked .sign, body.locked main, body.locked .tocbtn{display:none}
#gate{display:none;min-height:100vh;align-items:center;justify-content:center;padding:24px}
body.locked #gate{display:flex}
.gatebox{width:100%;max-width:400px;background:var(--card);border:1px solid var(--rule);
  border-top:6px solid var(--line);border-radius:12px;padding:26px 22px}
.gatebox h1{font-size:22px;margin:0 0 4px;line-height:1.4}
.gatebox .sub{color:var(--sub);font-size:14px;margin:0 0 20px}
.gatebox label{display:block;font-weight:700;margin-bottom:6px}
.gatebox input{width:100%;font:inherit;font-size:18px;padding:13px 14px;border:2px solid var(--rule);
  border-radius:10px;background:var(--paper);color:var(--ink)}
.gatebox input:focus{border-color:var(--line);outline:none}
.gatebox button{width:100%;margin-top:14px;font:inherit;font-size:17px;font-weight:700;padding:13px;
  border:0;border-radius:10px;background:var(--line);color:#fff;cursor:pointer}
:root[data-theme="dark"] .gatebox button{color:#0E1522}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .gatebox button{color:#0E1522}}
.gatebox button[disabled]{opacity:.6;cursor:default}
.remember{display:flex;align-items:center;gap:9px;margin-top:14px;font-weight:400;font-size:15px;color:var(--sub);cursor:pointer}
.remember input{width:22px;height:22px;flex:none;accent-color:var(--line)}
.forget{background:none;border:0;padding:0;margin-top:10px;font:inherit;font-size:13px;color:var(--line);
  text-decoration:underline;cursor:pointer;display:block}
#gerr{color:var(--red);font-weight:700;margin:12px 0 0;min-height:1.6em}
.gatenote{color:var(--sub);font-size:13px;margin:18px 0 0;line-height:1.7;border-top:1px solid var(--rule);padding-top:12px}

/* 鍵の画面 */
.lockicon{display:block;margin:0 auto 14px;width:40px;height:40px;color:var(--line)}
.gatelead{margin:0 0 22px;text-align:center;color:var(--sub);font-size:15px;line-height:1.7}
</style>
</head>
<body class="locked">

<div id="gate">
  <div class="gatebox">
    <svg class="lockicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="4" y="10" width="16" height="11" rx="2"></rect>
      <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
    </svg>
    <p class="gatelead">このページはパスワードで保護されています。</p>
    <form id="gform">
      <label for="gpw">パスワード</label>
      <input id="gpw" type="password" autocomplete="current-password" autocapitalize="off"
             autocorrect="off" spellcheck="false">
      <label class="remember"><input type="checkbox" id="gremember">この端末では次回から入力しない</label>
      <button type="submit" id="gbtn">ひらく</button>
    </form>
    <p id="gerr" role="alert"></p>
  </div>
</div>

<div class="sign" id="sign" hidden></div>
<main class="wrap" id="main" hidden></main>
<a class="tocbtn" href="#home" id="tocbtn" hidden></a>

const b64 = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));

async function unlock(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

const gpw = document.getElementById("gpw"),
      gbtn = document.getElementById("gbtn"),
      gerr = document.getElementById("gerr"),
      gremember = document.getElementById("gremember");

async function tryOpen(pw, fromMemory){
  gerr.textContent = "";
  gbtn.disabled = true; gbtn.textContent = "確認中…";
  try{
    const all = await unlock(pw);
    try{
      if(gremember.checked){ localStorage.setItem("gpw", pw); sessionStorage.removeItem("gpw"); }
      else { sessionStorage.setItem("gpw", pw); localStorage.removeItem("gpw"); }
    }catch(e){}
    document.body.classList.remove("locked");
    build(all.shell, all.data);
  }catch(e){
    gbtn.disabled = false; gbtn.textContent = "ひらく";
    if(!fromMemory){ gerr.textContent = "パスワードが違います。もう一度入れてください。"; gpw.select(); }
  }
}

document.getElementById("gform").addEventListener("submit", e => {
  e.preventDefault(); if(gpw.value) tryOpen(gpw.value, false);
});

(function(){
  let saved = null, remembered = false;
  try{
    saved = localStorage.getItem("gpw");
    if(saved){ remembered = true; } else { saved = sessionStorage.getItem("gpw"); }
  }catch(e){}
  if(remembered) gremember.checked = true;
  if(saved) tryOpen(saved, true);
})();

/* ===== 鍵を開けたあとに画面を組み立てる ===== */
function build(S, data){
  const CHAPTERS = data.CHAPTERS, FAQ = data.FAQ;
  document.title = S.title;

  const sign = document.getElementById("sign");
  sign.innerHTML = `<div class="wrap"><h1>${S.title}</h1><p>${S.lead}</p></div>`;
  sign.hidden = false;

  const main = document.getElementById("main");
  main.innerHTML = `
    <section class="page" id="home">
      <div class="notice">${S.notice}</div>
      <div class="search">
        <label for="q" style="font-weight:700;display:block;margin-bottom:6px">${S.searchLabel}</label>
        <input id="q" type="search" placeholder="${S.searchPlaceholder}" autocomplete="off">
        <div id="results"></div>
      </div>
      <h2 class="sec">${S.faqHeading}</h2>
      <div class="faq" id="faq"></div>
      <h2 class="sec">${S.tocHeading}</h2>
      <ol class="route" id="toc"></ol>
      <footer>${S.footer}
        <button type="button" class="forget" id="forget">${S.forget}</button>
      </footer>
    </section>
    <div id="pages"></div>`;
  main.hidden = false;

  const tocbtn = document.getElementById("tocbtn");
  tocbtn.textContent = S.tocbtn;

  document.getElementById("forget").addEventListener("click", ()=>{
    try{ localStorage.removeItem("gpw"); sessionStorage.removeItem("gpw"); }catch(e){}
    location.reload();
  });

  const allPages = [];
  CHAPTERS.forEach(c => c.pages.forEach(p => allPages.push({...p, chap:c})));

  document.getElementById("toc").innerHTML = CHAPTERS.map(c => `
    <li class="chap"><p class="chap-title">${c.title}<small>（${c.sub}）</small></p>
      <ul class="stops">${c.pages.map(p=>`<li><a href="#${p.id}"><span class="nm">${p.name}</span><span class="rg">${p.range}</span></a></li>`).join("")}</ul>
    </li>`).join("");

  document.getElementById("faq").innerHTML = FAQ.map(f=>`<a href="#${f[2]}" data-art="${f[3]}">${f[0]}<small>${f[1]}</small></a>`).join("");

  document.getElementById("pages").innerHTML = allPages.map((p,i) => {
    const prev = allPages[i-1], next = allPages[i+1];
    return `<section class="page" id="${p.id}">
      <p class="crumb">${p.chap.title}（${p.range}）</p>
      <h2 class="ptitle">${p.name}</h2>
      <p class="plead">${p.lead}</p>
      ${p.arts.map(a=>`<article class="art" id="a-${a.no}">
        <header><span class="no">${a.label||S.artLabel.replace("{n}", a.no)}</span><h3>${a.t}</h3></header>
        <p class="short">${a.s}</p>
        ${a.b?`<div class="body">${a.b}</div>`:`<div style="height:14px"></div>`}
      </article>`).join("")}
      <nav class="pager">
        ${prev?`<a href="#${prev.id}">← ${prev.name}</a>`:`<a class="empty"></a>`}
        ${next?`<a href="#${next.id}">${next.name} →</a>`:`<a href="#home">${S.tocHeading}にもどる</a>`}
      </nav>
    </section>`;
  }).join("");

  let pendingArt = null;
  function route(){
    const h = decodeURIComponent(location.hash.slice(1)) || "home";
    const el0 = document.getElementById(h);
    const target = el0 && el0.classList.contains("page") ? h : "home";
    document.querySelectorAll(".page").forEach(s=>s.classList.toggle("show", s.id===target));
    tocbtn.hidden = target==="home";
    if(pendingArt){ const el=document.getElementById(pendingArt); pendingArt=null; if(el){el.scrollIntoView();return;} }
    window.scrollTo(0,0);
  }
  window.addEventListener("hashchange", route);
  document.addEventListener("click", e=>{
    const a = e.target.closest("[data-art]");
    if(a){ pendingArt = a.dataset.art; if(location.hash==="#"+a.getAttribute("href").slice(1)){ e.preventDefault(); route(); } }
  });
  route();

  const idx = [];
  allPages.forEach(p=>p.arts.forEach(a=>{
    const text = (a.t+" "+a.s+" "+a.b.replace(/<[^>]+>/g," ")).replace(/\s+/g," ");
    idx.push({p, a, text});
  }));
  const q = document.getElementById("q"), res = document.getElementById("results");
  q.addEventListener("input", ()=>{
    const v = q.value.trim();
    if(!v){res.innerHTML="";return;}
    const hits = idx.filter(x=>x.text.includes(v) || (x.a.label||S.artLabel.replace("{n}", x.a.no)).includes(v));
    res.innerHTML = hits.length
      ? hits.slice(0,20).map(x=>`<a class="hit" href="#${x.p.id}" data-art="a-${x.a.no}"><b>${x.a.label||S.artLabel.replace("{n}", x.a.no)}</b> ${x.a.t}<span>${x.a.s}</span></a>`).join("")
      : `<p style="color:var(--sub)">「${v.replace(/[<>&]/g,"")}」は見つかりませんでした。ほかの言葉でさがしてみてください。</p>`;
  });
}

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
